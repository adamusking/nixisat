; ─────────────────────────────────────────────────────────────────────────────
; NixiSat — Flight Controller
; ESP32-S3-WROOM-1U (N16R8) — Upper MCU
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Flash & PSRAM (N16R8: 16 MB QIO Flash, 8 MB OPI PSRAM) ──────────────────
board_upload.flash_size         = 16MB
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi

; FC doesn't need huge_app — default partitions are fine, but keep the
; setting so we can drop in additional features later without re-flashing
; layout.
board_build.partitions          = default.csv

; ── Serial monitor ───────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; ── Upload ───────────────────────────────────────────────────────────────────
upload_speed = 921600

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    jgromes/RadioLib@^7.4.0
    mikalhart/TinyGPSPlus@^1.1.0
    hideakitai/MPU9250@^0.4.8
    adafruit/Adafruit Unified Sensor@^1.1.15
    adafruit/Adafruit BME280 Library@^2.3.0
    arduino-libraries/Madgwick@^1.2.0

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10

    ; Floating point printf support
    -Wl,-u,vfprintf,-lprintf_flt
